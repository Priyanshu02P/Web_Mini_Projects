services:
  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: learning-project-secret-change-me
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: http://localhost:5173
      MONGO_URI: ${MONGO_URI}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: todo-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
   